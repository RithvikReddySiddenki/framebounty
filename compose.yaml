services:
  worker:
    profiles: ["worker"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://framebounty:framebounty@postgres:5432/framebounty
      APP_MODE: fixture
      STORAGE_ROOT: /app/.local/media
    volumes: ["./.local/media:/app/.local/media"]
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: framebounty
      POSTGRES_PASSWORD: framebounty
      POSTGRES_DB: framebounty
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framebounty"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
