services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: framebounty
      POSTGRES_PASSWORD: framebounty
      POSTGRES_DB: framebounty
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framebounty"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
