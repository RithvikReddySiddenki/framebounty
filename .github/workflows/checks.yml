name: Deterministic checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - run: npm ci --prefix contracts
      - run: python scripts/setup_arc_tools.py
      - run: .local/arc-foundry/forge test --root contracts --use "$PWD/.local/arc-foundry/solc-0.8.24" --offline -vv
      - run: python scripts/export_contract.py --check
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: framebounty
          POSTGRES_PASSWORD: framebounty
          POSTGRES_DB: framebounty_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U framebounty"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://framebounty:framebounty@localhost:5432/framebounty_test
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: pip install -r services/api/requirements.lock
      - run: pip install --no-deps -e './services/api[test]'
      - run: python -m pytest services/api/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix contracts
      - run: python scripts/setup_arc_tools.py
      - run: .local/arc-foundry/forge build --root contracts --use "$PWD/.local/arc-foundry/solc-0.8.24" --offline
      - run: python scripts/export_contract.py --check
      - run: python scripts/test_chain.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix apps/web
      - run: npm exec --prefix apps/web -- playwright install --with-deps chromium
      - run: python scripts/test_e2e.py
      - run: python scripts/test_e2e.py --grep 'draft funding and review panels'
        env:
          NEXT_PUBLIC_ENABLE_CHAIN_FUNDING: "true"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:publishing
      - run: npm run build
