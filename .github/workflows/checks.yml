name: Deterministic checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: framebounty
          POSTGRES_PASSWORD: framebounty
          POSTGRES_DB: framebounty_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U framebounty"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://framebounty:framebounty@localhost:5432/framebounty_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/api/requirements.lock
      - run: pip install --no-deps -e './services/api[test]'
      - run: python -m pytest services/api/tests -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
