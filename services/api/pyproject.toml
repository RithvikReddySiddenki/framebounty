[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "framebounty-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "eth-account>=0.13,<1", "eth-abi>=6,<7", "eth-utils>=6,<7", "hexbytes>=2,<3", "rlp>=5,<6", "httpx>=0.28,<1", "Pillow>=11,<14", "ImageHash>=4.3,<5", "zipstream-ng>=1.9,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["framebounty*"]

[tool.setuptools.package-data]
framebounty = ["contract_abi/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
